<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AST viewer</title>
<style>
  body { margin: 0; display: flex; height: 100vh; font: 14px sans-serif; color: #222; background: #fff; }
  #src { width: 32%; margin: 0; padding: 12px 16px; overflow: auto; background: #f6f6f6;
         border-right: 1px solid #ddd; font: 13px/1.45 monospace; }
  #view { flex: 1; position: relative; overflow: hidden; }
  #info { position: absolute; top: 10px; left: 16px; color: #555; }
  #info span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 12px; }
  svg { width: 100%; height: 100%; cursor: grab; }
  .link { fill: none; stroke: #c4c4c4; }
  .node { cursor: pointer; }
  .node text { font: 12px monospace; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
  @media (max-width: 700px) { body { flex-direction: column; } #src { width: auto; height: 30vh; } }
</style>
</head>
<body>
<pre id="src"></pre>
<div id="view">
  <div id="info"></div>
  <svg></svg>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="ast.js"></script>
<script>
const COLORS = { stmt: '#4e79a7', expr: '#f28e2b', leaf: '#59a14f' };
const STMT = new Set(['Program', 'Func', 'Params', 'Param', 'Block', 'Decls', 'Decl', 'ArrDecl',
                      'If', 'While', 'For', 'Return', 'Break', 'Continue', 'Cout']);

function color(d) {
  if (STMT.has(d.data.name.split(' ')[0])) return COLORS.stmt;
  return d.data.children ? COLORS.expr : COLORS.leaf;
}

document.getElementById('src').textContent = AST.src;
document.getElementById('info').innerHTML = `<b>${AST.file}</b>` +
  Object.entries(COLORS).map(([k, c]) => `<span style="background:${c}"></span>${k}`).join('') +
  ' &nbsp; click a node to fold it';

const svg = d3.select('svg');
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.2, 3]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

const root = d3.hierarchy(AST.tree);
root.each((d, i) => d.id = i);
const layout = d3.tree().nodeSize([24, 170]);
const pos = d => `translate(${d.y},${d.x})`;

function toggle(d) {
  [d.children, d._children] = [d._children, d.children];
  update();
}

function update() {
  layout(root);
  g.selectAll('path.link')
    .data(root.links(), d => d.target.id)
    .join('path')
    .attr('class', 'link')
    .transition().duration(250)
    .attr('d', d3.linkHorizontal().x(d => d.y).y(d => d.x));

  const node = g.selectAll('g.node')
    .data(root.descendants(), d => d.id)
    .join(enter => {
      const n = enter.append('g').attr('class', 'node')
        .attr('transform', d => pos(d.parent || d))
        .on('click', (e, d) => toggle(d));
      n.append('circle').attr('r', 5).attr('stroke-width', 2);
      n.append('text').attr('dx', 9).attr('dy', 4).text(d => d.data.name);
      return n;
    });
  node.raise().transition().duration(250).attr('transform', pos);
  // hollow circle = folded node
  node.select('circle').attr('stroke', color).attr('fill', d => d._children ? '#fff' : color(d));
}

update();

// fit the whole tree on screen
const { clientWidth: w, clientHeight: h } = svg.node();
const xs = root.descendants().map(d => d.x), ys = root.descendants().map(d => d.y);
const [x0, x1] = d3.extent(xs);
const k = Math.max(0.2, Math.min(1, (h - 60) / (x1 - x0 + 1), (w - 40) / (d3.max(ys) + 200)));
svg.call(zoom.transform, d3.zoomIdentity.translate(30, 40 - x0 * k).scale(k));
</script>
</body>
</html>
